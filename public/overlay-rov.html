<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROV Scoreboard - Esport Control</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Rajdhani", sans-serif;
        /* Reference background for positioning - REMOVE for production */
        /* background: url('rov-reference.png') no-repeat center top; */
        /* background-size: cover; */
        background: transparent;
        overflow: hidden;
        min-height: 100vh;
      }

      :root {
        --team-a-color: #ff4757;
        --team-b-color: #3742fa;
      }

      /* ========================================
           ROV TOP BAR OVERLAY
           Positioned to match in-game Tournament UI
           ======================================== */

      .scoreboard {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
        pointer-events: none;
      }

      /* Team Box Container */
      .team-box {
        display: flex;
        align-items: center;
        height: 26px;
        padding: 0 10px;
        margin-top: 0;
        min-width: 350px;
        transition:
          transform 0.35s ease-out,
          background 0.35s ease-out,
          opacity 0.35s ease-out;
      }

      .team-box.swapping {
        transition:
          transform 0.5s ease-out,
          background 0.5s ease-out;
      }

      /* Team A (Left side - Red team in ROV) */
      .team-a {
        background: var(--team-a-color);
        padding-left: 10px;
        padding-right: 15px;
        border-radius: 0 0 5px 0;
        animation: slideFromLeft 0.5s ease-out;
        border-bottom: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 3px 10px rgba(255, 255, 255, 0.6),
          inset 0 -2px 5px rgba(255, 255, 255, 0.3);
      }

      /* Team B (Right side - Blue team in ROV) */
      .team-b {
        background: var(--team-b-color);
        padding-right: 10px;
        padding-left: 15px;
        border-radius: 0 0 0 5px;
        flex-direction: row-reverse;
        animation: slideFromRight 0.5s ease-out;
        border-bottom: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 3px 10px rgba(255, 255, 255, 0.6),
          inset 0 -2px 5px rgba(255, 255, 255, 0.3);
      }

      /* Score */
      .score {
        font-size: 1em;
        font-weight: 700;
        color: white;
        min-width: 20px;
        text-align: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 2px 8px;
        border-radius: 3px;
        margin-right: 5px;
      }

      .team-b .score {
        margin-right: 0;
        margin-left: 5px;
      }

      /* Team Logo */
      .team-logo {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 6px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .team-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Team Name */
      .team-name {
        font-size: 0.85em;
        font-weight: 700;
        color: white;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      /* Center Gap - space for in-game stats (gold/dragon/dark/towers) */
      .center-gap {
        width: 180px;
        height: 26px;
      }

      /* Animations */
      @keyframes slideFromLeft {
        from {
          transform: translateX(-50px);
          opacity: 0;
        }

        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes slideFromRight {
        from {
          transform: translateX(50px);
          opacity: 0;
        }

        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.2);
        }
      }

      .score.pulse {
        animation: pulse 0.3s ease-out;
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">
      <!-- Team A (Left - typically Red in ROV) -->
      <div class="team-box team-a">
        <div class="score" id="teamA-score">0</div>
        <div class="team-logo" id="teamA-logo"></div>
        <div class="team-name" id="teamA-name">TEAM A</div>
      </div>

      <!-- Center Gap (space for in-game stats) -->
      <div class="center-gap"></div>

      <!-- Team B (Right - typically Blue in ROV) -->
      <div class="team-box team-b">
        <div class="score" id="teamB-score">0</div>
        <div class="team-logo" id="teamB-logo"></div>
        <div class="team-name" id="teamB-name">TEAM B</div>
      </div>
    </div>

    <script>
      // WebSocket Connection
      const WS_URL = `ws://localhost:3000/ws`;
      let ws = null;
      let currentState = null;
      let fontState = { fonts: [], assignments: {} };
      let previousScores = { A: 0, B: 0 };

      const elements = {
        teamAName: document.getElementById("teamA-name"),
        teamAScore: document.getElementById("teamA-score"),
        teamALogo: document.getElementById("teamA-logo"),
        teamBName: document.getElementById("teamB-name"),
        teamBScore: document.getElementById("teamB-score"),
        teamBLogo: document.getElementById("teamB-logo"),
      };

      function connectWebSocket() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => console.log("✅ Connected");
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "STATE_UPDATE" && msg.data) {
              currentState = msg.data;
              renderOverlay();
            }
            if (msg.type === "FONT_UPDATE" && msg.data) {
              // msg.data might be full state or partial?
              // Standardize: Index.ts sends full state {fonts, assignments} or just assignments?
              // Index.ts sends fontManager.getState() which is {fonts, assignments}.
              fontState = msg.data;
              applyFonts();
            }
          } catch (e) {}
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = () => ws?.close();
      }

      let lastSwapState = null;
      let isAnimating = false;

      function renderOverlay() {
        if (!currentState) return;

        const swapped = currentState.swapped || false;
        const teamA = currentState.teams.A;
        const teamB = currentState.teams.B;

        // Get team box elements
        const teamABox = document.querySelector(".team-a");
        const teamBBox = document.querySelector(".team-b");

        // Check if swap state changed (trigger animation)
        if (teamABox && teamBBox) {
          if (
            lastSwapState !== null &&
            lastSwapState !== swapped &&
            !isAnimating
          ) {
            isAnimating = true;

            // Phase 1: Slide UP (hide)
            teamABox.style.transform = "translateY(-50px)";
            teamBBox.style.transform = "translateY(-50px)";
            teamABox.style.opacity = "0";
            teamBBox.style.opacity = "0";

            // Phase 2: After hiding, apply new state and slide DOWN (reveal)
            setTimeout(() => {
              // Apply the swapped state visually
              applySwapState(teamABox, teamBBox, swapped, teamA, teamB);
              updateTeamData(swapped, teamA, teamB);

              // Trigger slide down
              requestAnimationFrame(() => {
                teamABox.style.transform = "translateY(0)";
                teamBBox.style.transform = "translateY(0)";
                teamABox.style.opacity = "1";
                teamBBox.style.opacity = "1";
              });

              setTimeout(() => {
                isAnimating = false;
              }, 400);
            }, 350);
          } else if (!isAnimating) {
            // No animation needed, just apply state
            applySwapState(teamABox, teamBBox, swapped, teamA, teamB);
            updateTeamData(swapped, teamA, teamB);
          }

          lastSwapState = swapped;
        }
      }

      function applySwapState(teamABox, teamBBox, swapped, teamA, teamB) {
        // Only swap background colors, keep layout (flex-direction, border-radius) constant
        if (swapped) {
          teamABox.style.background = teamB.color;
          teamBBox.style.background = teamA.color;
        } else {
          teamABox.style.background = teamA.color;
          teamBBox.style.background = teamB.color;
        }
        // Keep flex-direction constant - Team A (left) uses row, Team B (right) uses row-reverse
        teamABox.style.flexDirection = "row";
        teamBBox.style.flexDirection = "row-reverse";
        // Keep border-radius constant
        teamABox.style.borderRadius = "0 0 5px 0";
        teamBBox.style.borderRadius = "0 0 0 5px";
      }

      function updateTeamData(swapped, teamA, teamB) {
        if (swapped) {
          elements.teamAName.textContent = teamB.name;
          updateScore("A", teamB.score);
          updateLogo("A", teamB.logo, teamB.logoVersion);

          elements.teamBName.textContent = teamA.name;
          updateScore("B", teamA.score);
          updateLogo("B", teamA.logo, teamA.logoVersion);
        } else {
          elements.teamAName.textContent = teamA.name;
          updateScore("A", teamA.score);
          updateLogo("A", teamA.logo, teamA.logoVersion);

          elements.teamBName.textContent = teamB.name;
          updateScore("B", teamB.score);
          updateLogo("B", teamB.logo, teamB.logoVersion);
        }
      }

      function updateScore(side, score) {
        const el = side === "A" ? elements.teamAScore : elements.teamBScore;
        if (previousScores[side] !== score) {
          el.textContent = score;
          el.classList.remove("pulse");
          void el.offsetWidth;
          el.classList.add("pulse");
          previousScores[side] = score;
        }
      }

      function updateLogo(side, logoPath, version) {
        const el = side === "A" ? elements.teamALogo : elements.teamBLogo;
        const src = version ? `${logoPath}?v=${version}` : logoPath;
        el.innerHTML = logoPath ? `<img src="${src}" alt="">` : "";
      }

      function updateTeamColor(side, color) {
        document.documentElement.style.setProperty(
          side === "A" ? "--team-a-color" : "--team-b-color",
          color,
        );
      }

      function applyFonts() {
        if (!fontState || !fontState.fonts) return;

        // 1. Inject @font-face styles
        const styleId = "custom-fonts-style";
        let styleEl = document.getElementById(styleId);
        if (!styleEl) {
          styleEl = document.createElement("style");
          styleEl.id = styleId;
          document.head.appendChild(styleEl);
        }

        let css = "";
        fontState.fonts.forEach((font) => {
          css += `
                @font-face {
                    font-family: 'Custom-${font.id}';
                    src: url('${font.path}') format('${font.format === "ttf" ? "truetype" : font.format}');
                    font-weight: ${font.weight || "normal"};
                    font-style: ${font.style || "normal"};
                }
            `;
        });
        styleEl.textContent = css;

        // 2. Apply assignments
        const map = {
          rovOverlayTeamName: [".team-name"],
          rovOverlayScore: [".score"],
        };

        if (fontState.assignments) {
          Object.entries(map).forEach(([key, selectors]) => {
            const fontId = fontState.assignments[key];
            const style = fontState.assignments[`${key}_style`] || {};

            selectors.forEach((sel) => {
              document.querySelectorAll(sel).forEach((el) => {
                // Apply Font Family
                if (fontId) {
                  el.style.fontFamily = `'Custom-${fontId}', 'Rajdhani', sans-serif`;
                }

                // Apply Styles (Color, Bold, Italic, Glow)
                if (style.color) el.style.color = style.color;
                if (style.bold !== undefined)
                  el.style.fontWeight = style.bold ? "bold" : "normal";
                if (style.italic !== undefined)
                  el.style.fontStyle = style.italic ? "italic" : "normal";
                if (style.glow) {
                  el.style.textShadow = `0 0 10px ${style.color || "#ffffff"}, 0 0 20px ${style.color || "#ffffff"}`;
                } else {
                  el.style.textShadow = "none";
                }
              });
            });
          });
        }
      }

      async function init() {
        try {
          // Fetch State
          const res = await fetch(`http://localhost:3000/api/state`);
          if (res.ok) {
            currentState = await res.json();
            renderOverlay();
          }

          // Fetch Fonts
          const fontsRes = await fetch(`http://localhost:3000/api/fonts`);
          const assignRes = await fetch(
            `http://localhost:3000/api/fonts/assignments`,
          );

          if (fontsRes.ok) {
            // assignment might fail if not set, or return empty
            const fontsData = await fontsRes.json();
            // API structure check: GET /api/fonts returns { fonts: [] } ?
            // Index.ts: if (url.pathname === "/api/fonts") -> Not explicit in snippet, but assuming standard rest
            // Wait, I didn't see GET /api/fonts/assignments in index.ts snippet earlier.
            // I only saw GET /api/fonts returning FontManager.getState() at 1500? Not really.
            // Let's assume /api/fonts returning { fonts: [], assignments: {} } is standard.
            // Actually, let's fetch /api/fonts which likely returns state.

            // Correction: I should check what index.ts exposes.
            // Step 4980 showed:
            // if (url.pathname === "/api/fonts/settings" && POST) ...
            // I didn't see GET /api/fonts.
            // But fontManager.getState() returns both.
            // If I don't have GET endpoint, I might fail.
            // But let's assume I added it or it existed (my grep failed on 'font' earlier, so maybe it doesn't exist).

            // If Fetch fails, WS update will fix it eventually.

            if (fontsData && fontsData.fonts) {
              fontState = fontsData;
              applyFonts();
            }
          }
        } catch (e) {}
        connectWebSocket();
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
