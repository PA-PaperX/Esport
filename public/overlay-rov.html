<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROV Scoreboard - Esport Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            /* Reference background for positioning - REMOVE for production */
            /* background: url('rov-reference.png') no-repeat center top; */
            /* background-size: cover; */
            background: transparent;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Toggle reference image for positioning */
        body.show-reference {
            background: url('rov-reference.png') no-repeat center top;
            background-size: 100% auto;
        }

        :root {
            --team-a-color: #ff4757;
            --team-b-color: #3742fa;
        }

        /* ========================================
           ROV TOP BAR OVERLAY
           Positioned to match in-game Tournament UI
           ======================================== */

        .scoreboard {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            pointer-events: none;
        }

        /* Team Box Container */
        .team-box {
            display: flex;
            align-items: center;
            height: 26px;
            padding: 0 10px;
            margin-top: 0;
            min-width: 350px;
            transition: transform 0.35s ease-out, background 0.35s ease-out, opacity 0.35s ease-out;
        }

        .team-box.swapping {
            transition: transform 0.5s ease-out, background 0.5s ease-out;
        }

        /* Team A (Left side - Red team in ROV) */
        .team-a {
            background: var(--team-a-color);
            padding-left: 10px;
            padding-right: 15px;
            border-radius: 0 0 5px 0;
            animation: slideFromLeft 0.5s ease-out;
            border-bottom: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 3px 10px rgba(255, 255, 255, 0.6), inset 0 -2px 5px rgba(255, 255, 255, 0.3);
        }

        /* Team B (Right side - Blue team in ROV) */
        .team-b {
            background: var(--team-b-color);
            padding-right: 10px;
            padding-left: 15px;
            border-radius: 0 0 0 5px;
            flex-direction: row-reverse;
            animation: slideFromRight 0.5s ease-out;
            border-bottom: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 3px 10px rgba(255, 255, 255, 0.6), inset 0 -2px 5px rgba(255, 255, 255, 0.3);
        }

        /* Score */
        .score {
            font-size: 1em;
            font-weight: 700;
            color: white;
            min-width: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 3px;
            margin-right: 5px;
        }

        .team-b .score {
            margin-right: 0;
            margin-left: 5px;
        }

        /* Team Logo */
        .team-logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 6px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Team Name */
        .team-name {
            font-size: 0.85em;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Center Gap - space for in-game stats (gold/dragon/dark/towers) */
        .center-gap {
            width: 180px;
            height: 26px;
        }

        /* Animations */
        @keyframes slideFromLeft {
            from {
                transform: translateX(-50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideFromRight {
            from {
                transform: translateX(50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .score.pulse {
            animation: pulse 0.3s ease-out;
        }

        /* Debug toggle button */
        .debug-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 8px 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
            opacity: 0.7;
        }

        .debug-toggle:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="scoreboard">
        <!-- Team A (Left - typically Red in ROV) -->
        <div class="team-box team-a">
            <div class="score" id="teamA-score">0</div>
            <div class="team-logo" id="teamA-logo"></div>
            <div class="team-name" id="teamA-name">TEAM A</div>
        </div>

        <!-- Center Gap (space for in-game stats) -->
        <div class="center-gap"></div>

        <!-- Team B (Right - typically Blue in ROV) -->
        <div class="team-box team-b">
            <div class="score" id="teamB-score">0</div>
            <div class="team-logo" id="teamB-logo"></div>
            <div class="team-name" id="teamB-name">TEAM B</div>
        </div>
    </div>

    <!-- Debug Toggle Button - Remove for production -->
    <button class="debug-toggle" onclick="toggleReference()">Toggle Reference BG</button>

    <script>
        // Toggle reference background for positioning
        function toggleReference() {
            document.body.classList.toggle('show-reference');
        }

        // WebSocket Connection
        const WS_URL = `ws://${window.location.host}`;
        let ws = null;
        let currentState = null;
        let previousScores = { A: 0, B: 0 };

        const elements = {
            teamAName: document.getElementById('teamA-name'),
            teamAScore: document.getElementById('teamA-score'),
            teamALogo: document.getElementById('teamA-logo'),
            teamBName: document.getElementById('teamB-name'),
            teamBScore: document.getElementById('teamB-score'),
            teamBLogo: document.getElementById('teamB-logo'),
        };

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => console.log('✅ Connected');
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'STATE_UPDATE' && msg.data) {
                        currentState = msg.data;
                        renderOverlay();
                    }
                } catch (e) { }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
            ws.onerror = () => ws?.close();
        }

        let lastSwapState = null;
        let isAnimating = false;

        function renderOverlay() {
            if (!currentState) return;

            const swapped = currentState.swapped || false;
            const teamA = currentState.teams.A;
            const teamB = currentState.teams.B;

            // Get team box elements
            const teamABox = document.querySelector('.team-a');
            const teamBBox = document.querySelector('.team-b');

            // Check if swap state changed (trigger animation)
            if (teamABox && teamBBox) {
                if (lastSwapState !== null && lastSwapState !== swapped && !isAnimating) {
                    isAnimating = true;

                    // Phase 1: Slide UP (hide)
                    teamABox.style.transform = 'translateY(-50px)';
                    teamBBox.style.transform = 'translateY(-50px)';
                    teamABox.style.opacity = '0';
                    teamBBox.style.opacity = '0';

                    // Phase 2: After hiding, apply new state and slide DOWN (reveal)
                    setTimeout(() => {
                        // Apply the swapped state visually
                        applySwapState(teamABox, teamBBox, swapped, teamA, teamB);
                        updateTeamData(swapped, teamA, teamB);

                        // Trigger slide down
                        requestAnimationFrame(() => {
                            teamABox.style.transform = 'translateY(0)';
                            teamBBox.style.transform = 'translateY(0)';
                            teamABox.style.opacity = '1';
                            teamBBox.style.opacity = '1';
                        });

                        setTimeout(() => {
                            isAnimating = false;
                        }, 400);
                    }, 350);

                } else if (!isAnimating) {
                    // No animation needed, just apply state
                    applySwapState(teamABox, teamBBox, swapped, teamA, teamB);
                    updateTeamData(swapped, teamA, teamB);
                }

                lastSwapState = swapped;
            }
        }

        function applySwapState(teamABox, teamBBox, swapped, teamA, teamB) {
            // Only swap background colors, keep layout (flex-direction, border-radius) constant
            if (swapped) {
                teamABox.style.background = teamB.color;
                teamBBox.style.background = teamA.color;
            } else {
                teamABox.style.background = teamA.color;
                teamBBox.style.background = teamB.color;
            }
            // Keep flex-direction constant - Team A (left) uses row, Team B (right) uses row-reverse
            teamABox.style.flexDirection = 'row';
            teamBBox.style.flexDirection = 'row-reverse';
            // Keep border-radius constant
            teamABox.style.borderRadius = '0 0 5px 0';
            teamBBox.style.borderRadius = '0 0 0 5px';
        }

        function updateTeamData(swapped, teamA, teamB) {
            if (swapped) {
                elements.teamAName.textContent = teamB.name;
                updateScore('A', teamB.score);
                updateLogo('A', teamB.logo, teamB.logoVersion);

                elements.teamBName.textContent = teamA.name;
                updateScore('B', teamA.score);
                updateLogo('B', teamA.logo, teamA.logoVersion);
            } else {
                elements.teamAName.textContent = teamA.name;
                updateScore('A', teamA.score);
                updateLogo('A', teamA.logo, teamA.logoVersion);

                elements.teamBName.textContent = teamB.name;
                updateScore('B', teamB.score);
                updateLogo('B', teamB.logo, teamB.logoVersion);
            }
        }

        function updateScore(side, score) {
            const el = side === 'A' ? elements.teamAScore : elements.teamBScore;
            if (previousScores[side] !== score) {
                el.textContent = score;
                el.classList.remove('pulse');
                void el.offsetWidth;
                el.classList.add('pulse');
                previousScores[side] = score;
            }
        }

        function updateLogo(side, logoPath, version) {
            const el = side === 'A' ? elements.teamALogo : elements.teamBLogo;
            const src = version ? `${logoPath}?v=${version}` : logoPath;
            el.innerHTML = logoPath ? `<img src="${src}" alt="">` : '';
        }

        function updateTeamColor(side, color) {
            document.documentElement.style.setProperty(
                side === 'A' ? '--team-a-color' : '--team-b-color', color
            );
        }

        async function init() {
            try {
                const res = await fetch(`http://${window.location.host}/api/state`);
                if (res.ok) { currentState = await res.json(); renderOverlay(); }
            } catch (e) { }
            connectWebSocket();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
