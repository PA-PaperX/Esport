<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Versus Screen - ESPORT LAYOUT</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- RESET & BASE --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e1a;
        font-family: "Rajdhani", sans-serif;
        color: white;
      }

      /* --- CSS VARIABLES --- */
      :root {
        --color-a: #4a9fd4;
        --color-b: #c75b39;
        --bg-dark: #0a0e1a;
        --bg-card: rgba(10, 15, 25, 0.95);
      }

      /* --- BACKGROUND --- */
      #bg-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #0a0e1a 0%, #0d1220 100%);
        z-index: 0;
      }

      /* --- MAIN CONTAINER --- */
      #main-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        z-index: 10;
      }

      /* --- PLAYERS BAR --- */
      .players-bar {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0;
      }

      /* --- TEAM SECTION (Players) --- */
      .team-players {
        display: flex;
        gap: 4px;
      }

      /* --- PLAYER CARD (TALLER FOR HERO FACES) --- */
      .player-card {
        width: 165px;
        height: 220px;
        position: relative;
        overflow: hidden;
        background: var(--bg-card);
        border: 2px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Hero/Champion Area - Full card */
      .hero-area {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-img {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 130%;
        height: auto;
        min-height: 100%;
        object-fit: cover;
        object-position: center 15%;
        animation: heroRise 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      @keyframes heroRise {
        from {
          transform: translateX(-50%) translateY(100%);
          opacity: 0;
        }

        to {
          transform: translateX(-50%) translateY(0);
          opacity: 1;
        }
      }

      .hero-placeholder {
        width: 50px;
        height: 50px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-placeholder::after {
        content: "";
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      /* --- PLAYER NAME BAR --- */
      .player-name {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px 5px;
        background: rgba(0, 0, 0, 0.85);
        text-align: center;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: white;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 10;
      }

      /* --- CENTER SECTION (Logo) --- */
      .center-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        margin: 0 15px;
      }

      .center-logo {
        width: 165px;
        height: 220px;
        background: linear-gradient(180deg, #4dd9e5 0%, #36a8b0 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.2);
      }

      .league-icon {
        width: 70px;
        height: 70px;
        margin-bottom: 10px;
      }

      .patch-text {
        font-size: 1rem;
        font-weight: 700;
        color: #0a0e1a;
        text-transform: uppercase;
      }

      /* --- TEAM INFO BAR (BOTTOM) --- */
      .team-info-bar {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        height: 60px;
        margin-top: 0;
      }

      .team-info {
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 15px;
      }

      #team-a-info {
        background: linear-gradient(
          90deg,
          var(--color-a) 0%,
          rgba(74, 159, 212, 0.3) 100%
        );
        flex: 1;
      }

      #team-b-info {
        background: linear-gradient(
          90deg,
          rgba(199, 91, 57, 0.3) 0%,
          var(--color-b) 100%
        );
        flex: 1;
        justify-content: flex-end;
      }

      .team-score {
        font-size: 2.5rem;
        font-weight: 800;
        line-height: 1;
        color: white;
      }

      .team-name {
        font-size: 1.3rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: white;
      }

      .team-coach {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.7);
      }

      .team-text {
        display: flex;
        flex-direction: column;
      }

      #team-b-info .team-text {
        text-align: right;
      }

      /* Center Score in Bar */
      .center-score-bar {
        width: 140px;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      .center-score-bar .team-score {
        font-size: 2rem;
      }

      /* --- ANIMATIONS --- */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .player-card {
        animation: fadeInUp 0.5s ease-out backwards;
      }

      #team-a-players .player-card:nth-child(1) {
        animation-delay: 0.05s;
      }

      #team-a-players .player-card:nth-child(2) {
        animation-delay: 0.1s;
      }

      #team-a-players .player-card:nth-child(3) {
        animation-delay: 0.15s;
      }

      #team-a-players .player-card:nth-child(4) {
        animation-delay: 0.2s;
      }

      #team-a-players .player-card:nth-child(5) {
        animation-delay: 0.25s;
      }

      #team-b-players .player-card:nth-child(1) {
        animation-delay: 0.05s;
      }

      #team-b-players .player-card:nth-child(2) {
        animation-delay: 0.1s;
      }

      #team-b-players .player-card:nth-child(3) {
        animation-delay: 0.15s;
      }

      #team-b-players .player-card:nth-child(4) {
        animation-delay: 0.2s;
      }

      #team-b-players .player-card:nth-child(5) {
        animation-delay: 0.25s;
      }

      .team-info-bar {
        animation: fadeInUp 0.6s ease-out backwards;
        animation-delay: 0.3s;
      }

      .center-section {
        animation: fadeInUp 0.5s ease-out backwards;
        animation-delay: 0.1s;
      }
    </style>
  </head>

  <body>
    <div id="bg-layer"></div>

    <div id="main-container">
      <!-- Players Bar -->
      <div class="players-bar">
        <!-- Team A Players -->
        <div class="team-players" id="team-a-players">
          <!-- Players injected here -->
        </div>

        <!-- Center Section (Logo) -->
        <div class="center-section">
          <div class="center-logo">
            <svg class="league-icon" viewBox="0 0 100 100" fill="#0a0e1a">
              <path
                d="M50 5 L60 35 L95 35 L68 55 L78 90 L50 70 L22 90 L32 55 L5 35 L40 35 Z"
              />
            </svg>
            <span class="patch-text" id="patch-text">Patch 9.19</span>
          </div>
        </div>

        <!-- Team B Players -->
        <div class="team-players" id="team-b-players">
          <!-- Players injected here -->
        </div>
      </div>

      <!-- Team Info Bar (Bottom) -->
      <div class="team-info-bar">
        <div class="team-info" id="team-a-info">
          <span class="team-score" id="score-a">0</span>
          <div class="team-text">
            <span class="team-name" id="team-a-name">TEAM A</span>
          </div>
        </div>
        <div class="center-score-bar">
          <span class="team-score" id="center-score-a">0</span>
          <span style="color: rgba(255, 255, 255, 0.4)">-</span>
          <span class="team-score" id="center-score-b">0</span>
        </div>
        <div class="team-info" id="team-b-info">
          <div class="team-text">
            <span class="team-name" id="team-b-name">TEAM B</span>
          </div>
          <span class="team-score" id="score-b">0</span>
        </div>
      </div>
    </div>

    <script>
      const WS_URL = `ws://localhost:3000/ws`;
      let ws = null;
      let currentState = null;

      // --- HELPERS ---
      function getHeroImage(heroName) {
        if (!heroName) return null;
        let formatted = heroName.trim();
        formatted = formatted.charAt(0).toUpperCase() + formatted.slice(1);
        formatted = formatted.replace(/\s+/g, "_");
        return `/src/rov/${formatted}.png`;
      }

      // --- HERO POSITION MAPPING ---
      const HERO_POSITION_MAP = {
        // Right-positioned heroes (face/model on right side of splash art)
        aleister: "75% 15%",
        "d'arcy": "75% 15%",
        darcy: "75% 15%",
        florentino: "55% 15%",
        "lu bu": "70% 15%",
        lu_bu: "70% 15%",
        lubu: "70% 15%",
        zephys: "65% 15%",
        kriknak: "25% 15%",
        butterfly: "70% 15%",
        quillen: "65% 15%",
        nakroth: "70% 15%",
        murad: "65% 15%",
        raz: "70% 15%",
        hayate: "65% 15%",
        laville: "65% 15%",
        fennik: "65% 15%",
        keera: "55% 15%",
        paine: "70% 15%",
        ryoma: "65% 15%",
        omen: "65% 15%",
        "eland'or": "65% 15%",
        elandor: "65% 15%",
        airi: "65% 15%",
        dextra: "85% 15%",
        liliana: "70% 15%",
        zanis: "85% 15%",
        kaine: "75% 15%",
        alice: "70% 15%",
        allain: "75% 15%",
        astrid: "70% 15%",
        capheny: "70% 15%",
        charlotte: "65% 15%",
        dirak: "75% 15%",
        errol: "70% 15%",
        ishar: "70% 15%",
        lorion: "75% 15%",
        riktor: "70% 15%",
        sinestrea: "55% 15%",
        sephera: "70% 15%",
        tachi: "75% 15%",
        "tel'annas": "65% 15%",
        telannas: "65% 15%",
        yena: "70% 15%",
        veres: "70% 15%",
        volkath: "75% 15%",
        superman: "70% 15%",
        "the flash": "65% 15%",
        the_flash: "65% 15%",
        "wonder woman": "65% 15%",
        wonder_woman: "65% 15%",
        ignis: "75% 15%",
        wukong: "75% 15%",
        arduin: "85% 15%",
        kahlii: "70% 15%",
        lauriel: "80% 15%",

        // Left-positioned heroes (face/model on left side of splash art)
        violet: "30% 15%",
        yorn: "30% 15%",
        thane: "35% 15%",
        veera: "35% 15%",
        elsu: "30% 15%",
        lindis: "15% 15%",
        zuka: "35% 15%",
        annette: "35% 15%",
        arum: "30% 15%",
        krixi: "55% 15%",
        mina: "30% 15%",
        natalya: "35% 15%",
        wiro: "30% 15%",
        qi: "35% 15%",
        preyta: "35% 15%",
        aya: "25% 15%",
        ilumia: "30% 15%",

        // Default center is 'center 15%' (handled by getHeroPosition)
      };

      function getHeroPosition(heroName) {
        if (!heroName) return "center 15%";
        const key = heroName.toLowerCase().trim();
        return HERO_POSITION_MAP[key] || "center 15%";
      }

      // --- WEB SOCKET ---
      function connectWebSocket() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => console.log("✅ Connected");
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "STATE_UPDATE" && msg.data) {
              currentState = msg.data;
              render();
            }
          } catch (e) {}
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
      }

      // --- RENDER ---
      function render() {
        if (!currentState) return;

        const TeamA = currentState.teams.A;
        const TeamB = currentState.teams.B;

        // Update CSS Variables
        document.documentElement.style.setProperty(
          "--color-a",
          TeamA.color || "#4a9fd4",
        );
        document.documentElement.style.setProperty(
          "--color-b",
          TeamB.color || "#c75b39",
        );

        // Team Names
        document.getElementById("team-a-name").textContent =
          TeamA.name || "TEAM A";
        document.getElementById("team-b-name").textContent =
          TeamB.name || "TEAM B";

        // Scores
        const scoreA = TeamA.score || "0";
        const scoreB = TeamB.score || "0";
        document.getElementById("score-a").textContent = scoreA;
        document.getElementById("score-b").textContent = scoreB;
        document.getElementById("center-score-a").textContent = scoreA;
        document.getElementById("center-score-b").textContent = scoreB;

        // Players
        renderPlayers("team-a-players", TeamA.players);
        renderPlayers("team-b-players", TeamB.players);
      }

      function renderPlayers(containerId, players) {
        const container = document.getElementById(containerId);

        // Build map of current slots
        const currentMap = new Map();
        Array.from(container.children).forEach((el) => {
          currentMap.set(parseInt(el.dataset.slot), el);
        });

        players.forEach((player, index) => {
          let card = currentMap.get(player.slot);
          if (!card) {
            card = createCard(player, index);
            container.appendChild(card);
          } else {
            updateCard(card, player);
          }
        });
      }

      function createCard(player, index) {
        const el = document.createElement("div");
        el.className = "player-card";
        el.dataset.slot = player.slot;

        el.innerHTML = `
                <div class="hero-area">
                    ${getHeroContent(player.hero)}
                </div>
                <div class="player-name">${player.name || "Player"}</div>
            `;

        updateCard(el, player);
        return el;
      }

      function getHeroContent(heroName) {
        const src = getHeroImage(heroName);
        if (!src) {
          return `<div class="hero-placeholder"></div>`;
        }
        const position = getHeroPosition(heroName);
        return `<img class="hero-img" 
                         src="${src}" 
                         style="object-position: ${position}"
                         onerror="if(this.src.endsWith('.png')){this.src=this.src.replace('.png','.webp')}else{this.parentElement.innerHTML='<div class=\\'hero-placeholder\\'></div>'}"
                    >`;
      }

      function updateCard(el, player) {
        // Update player name
        const nameEl = el.querySelector(".player-name");
        if (nameEl) {
          nameEl.textContent = player.name || "Player";
        }

        // Update hero image
        const heroArea = el.querySelector(".hero-area");
        const currentImg = heroArea.querySelector("img.hero-img");
        const newSrc = getHeroImage(player.hero);

        if (newSrc) {
          if (
            currentImg &&
            !currentImg.src.includes(newSrc.replace(".png", ""))
          ) {
            currentImg.src = newSrc;
            currentImg.style.objectPosition = getHeroPosition(player.hero);
          } else if (!currentImg) {
            const placeholder = heroArea.querySelector(".hero-placeholder");
            if (placeholder) placeholder.remove();
            heroArea.insertAdjacentHTML(
              "beforeend",
              getHeroContent(player.hero),
            );
          } else if (currentImg) {
            currentImg.style.objectPosition = getHeroPosition(player.hero);
          }
        }
      }

      // Init
      connectWebSocket();
      async function init() {
        try {
          const res = await fetch("/api/state");
          if (res.ok) {
            currentState = await res.json();
            render();
          }
        } catch (e) {}
      }
      init();
    </script>
  </body>
</html>
