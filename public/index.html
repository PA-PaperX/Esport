<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esport Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/tokens.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* App Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) var(--space-6);
            background: var(--color-bg-secondary);
            border-bottom: 1px solid var(--color-border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header__brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .app-header__logo {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            letter-spacing: -0.5px;
        }

        .app-header__version {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            background: var(--color-bg-tertiary);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
        }

        .app-header__actions {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        /* Connection Status */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-danger);
            transition: all var(--transition-normal);
        }

        .status-dot.connected {
            background: #00FF66;
            box-shadow:
                0 0 4px #00FF66,
                0 0 8px #00FF66,
                0 0 16px rgba(0, 255, 102, 0.5);
            animation: neon-pulse 2s ease-in-out infinite;
        }

        @keyframes neon-pulse {

            0%,
            100% {
                box-shadow:
                    0 0 4px #00FF66,
                    0 0 8px #00FF66,
                    0 0 16px rgba(0, 255, 102, 0.5);
            }

            50% {
                box-shadow:
                    0 0 6px #00FF66,
                    0 0 12px #00FF66,
                    0 0 24px rgba(0, 255, 102, 0.7);
            }
        }

        /* Main Layout */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 0;
            overflow: hidden;
        }

        /* Team Panel */
        .team-panel {
            padding: var(--space-6);
            overflow-y: auto;
            background: var(--color-bg-primary);
        }

        .team-panel--a {
            border-right: 1px solid var(--color-border-light);
        }

        .team-panel--b {
            border-left: 1px solid var(--color-border-light);
        }

        .team-panel__header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .team-panel__indicator {
            width: 4px;
            height: 24px;
            border-radius: var(--radius-full);
        }

        .team-panel--a .team-panel__indicator {
            background: var(--color-team-a);
        }

        .team-panel--b .team-panel__indicator {
            background: var(--color-team-b);
        }

        .team-panel__title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }

        .team-panel__subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-left: var(--space-2);
        }

        /* Team Card */
        .team-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin-bottom: var(--space-6);
        }

        .team-card--a {
            border-left: 3px solid var(--color-team-a);
        }

        .team-card--b {
            border-left: 3px solid var(--color-team-b);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
        }

        /* Color Picker Row */
        .color-picker-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-1);
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            border: 2px solid var(--color-border);
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }

        .color-swatch::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-swatch::-webkit-color-swatch {
            border: none;
            border-radius: var(--radius-sm);
        }

        .color-hex {
            font-size: var(--font-size-xs);
            font-family: monospace;
            color: var(--color-text-tertiary);
        }

        /* Score Control */
        .score-control {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-1);
        }

        .score-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .score-btn--minus {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
        }

        .score-btn--minus:hover {
            background: var(--color-border);
        }

        .score-btn--plus-a {
            background: var(--color-team-a);
            color: white;
        }

        .score-btn--plus-b {
            background: var(--color-team-b);
            color: white;
        }

        .score-display {
            width: 56px;
            height: 36px;
            text-align: center;
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            background: var(--color-bg-primary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
        }

        /* Logo Upload */
        .logo-upload {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-top: var(--space-2);
        }

        .logo-preview {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-lg);
            background: var(--color-bg-tertiary);
            border: 2px dashed var(--color-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-preview__placeholder {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
        }

        .logo-upload__actions {
            flex: 1;
        }

        .logo-upload__hint {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: var(--space-1);
        }

        /* Update Button */
        .btn-update {
            width: 100%;
            padding: var(--space-3);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-semibold);
            margin-top: var(--space-4);
        }

        .btn-update--a {
            background: var(--color-team-a);
            color: white;
        }

        .btn-update--a:hover {
            filter: brightness(1.1);
        }

        .btn-update--b {
            background: var(--color-team-b);
            color: white;
        }

        .btn-update--b:hover {
            filter: brightness(1.1);
        }

        /* Roster Section */
        .roster-section {
            margin-top: var(--space-2);
        }

        .roster-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-3);
        }

        .roster-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .roster-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .roster-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }

        .roster-item:hover {
            border-color: var(--color-border);
            box-shadow: var(--shadow-sm);
        }

        .roster-item__slot {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-tertiary);
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-sm);
        }

        .roster-item__name {
            flex: 1;
        }

        .roster-item__name input {
            width: 100%;
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-size-sm);
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }

        .roster-item__name input:hover {
            background: var(--color-bg-primary);
            border-color: var(--color-border-light);
        }

        .roster-item__name input:focus {
            outline: none;
            background: var(--color-bg-primary);
            border-color: var(--color-accent);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }

        .roster-item__actions {
            display: flex;
            gap: var(--space-1);
        }

        .roster-btn {
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: var(--color-bg-primary);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .roster-btn:hover {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
        }

        /* Center Column - Swap */
        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
            background: var(--color-bg-secondary);
            border-left: 1px solid var(--color-border-light);
            border-right: 1px solid var(--color-border-light);
            min-width: 80px;
        }

        .swap-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-4);
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .swap-btn:hover {
            background: var(--color-bg-tertiary);
            box-shadow: var(--shadow-md);
            transform: scale(1.02);
        }

        .swap-btn i {
            font-size: var(--font-size-2xl);
            color: var(--color-text-primary);
        }

        .swap-btn span {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .swap-status {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: var(--space-3);
            text-align: center;
        }

        /* Template Selector */
        .template-selector {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }

        .template-selector select {
            flex: 1;
        }

        /* Navigation Menu */
        .nav-menu {
            position: absolute;
            top: 100%;
            left: 0;
            width: 280px;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            margin-top: var(--space-2);
            overflow: hidden;
            display: none;
            z-index: 200;
        }

        .nav-menu.active {
            display: block;
        }

        .nav-menu__header {
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--color-border-light);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-secondary);
        }

        .nav-menu__item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background var(--transition-fast);
            color: var(--color-text-primary);
        }

        .nav-menu__item:hover {
            background: var(--color-bg-tertiary);
        }

        .nav-menu__item.active {
            background: var(--color-team-a-bg);
            border-left: 3px solid var(--color-accent);
        }

        .nav-menu__item i {
            font-size: var(--font-size-xl);
            color: var(--color-text-secondary);
        }

        .nav-menu__item-text {
            flex: 1;
        }

        .nav-menu__item-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }

        .nav-menu__item-desc {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
        }

        /* Hidden pages */
        .page {
            display: none;
        }

        .page.active {
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>

<body class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="app-header__brand" style="position: relative;">
            <button id="hamburger-btn" class="btn btn-secondary btn-icon">
                <i class="ph-bold ph-list"></i>
            </button>
            <span class="app-header__logo">Esport Control</span>
            <span class="app-header__version">v1.0</span>

            <!-- Navigation Menu -->
            <nav id="settings-menu" class="nav-menu">
                <div class="nav-menu__header">Menu</div>
                <button id="nav-scoreboard" class="nav-menu__item active">
                    <i class="ph-duotone ph-game-controller"></i>
                    <div class="nav-menu__item-text">
                        <div class="nav-menu__item-title">Scoreboard</div>
                        <div class="nav-menu__item-desc">Teams, scores, players</div>
                    </div>
                </button>
                <button id="nav-broadcast" class="nav-menu__item">
                    <i class="ph-duotone ph-broadcast"></i>
                    <div class="nav-menu__item-text">
                        <div class="nav-menu__item-title">Broadcast</div>
                        <div class="nav-menu__item-desc">Transitions, overlays</div>
                    </div>
                </button>
            </nav>
        </div>

        <div class="app-header__actions">
            <button onclick="openTemplateManager()" class="btn btn-primary">
                <i class="ph-bold ph-folders"></i>
                Templates
            </button>
            <button onclick="location.reload()" class="btn btn-secondary">
                <i class="ph-bold ph-arrows-clockwise"></i>
            </button>
            <button id="theme-toggle-btn" class="btn btn-secondary btn-icon" title="Toggle theme">
                <i class="ph-bold ph-moon" id="theme-icon"></i>
            </button>
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="connection-status">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- Page: Scoreboard -->
    <div id="page-scoreboard" class="page active">
        <main class="main-content">
            <!-- Team A Panel -->
            <section class="team-panel team-panel--a" id="teamA-section">
                <div class="team-panel__header" id="teamA-header">
                    <div class="team-panel__indicator" id="teamA-accent"></div>
                    <h2 class="team-panel__title">Team A</h2>
                    <span class="team-panel__subtitle">(Home)</span>
                </div>

                <!-- Template Selector -->
                <div class="template-selector">
                    <select id="teamA-template" class="input">
                        <option value="">Select Template...</option>
                    </select>
                    <button onclick="loadTemplate('A')" class="btn btn-secondary">
                        <i class="ph-bold ph-download-simple"></i>
                        Load
                    </button>
                </div>

                <!-- Team Card -->
                <div class="team-card team-card--a" id="teamA-card">
                    <div class="form-group">
                        <label class="label">Team Name</label>
                        <input type="text" id="teamA-name" class="input" placeholder="Enter team name">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="label">Color</label>
                            <div class="color-picker-row">
                                <input type="color" id="teamA-color" class="color-swatch" value="#007AFF">
                                <button onclick="pickScreenColor('A')" class="btn btn-secondary btn-icon"
                                    title="Pick from screen">
                                    <i class="ph-bold ph-eyedropper"></i>
                                </button>
                                <button onclick="pickLogoColor('A')" class="btn btn-secondary btn-icon"
                                    title="Pick from logo">
                                    <i class="ph-bold ph-image"></i>
                                </button>
                                <span id="teamA-color-hex" class="color-hex">#007AFF</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label">Score</label>
                            <div class="score-control">
                                <button onclick="adjustScore('A', -1)" class="score-btn score-btn--minus">−</button>
                                <input type="number" id="teamA-score" class="score-display" value="0" readonly>
                                <button onclick="adjustScore('A', 1)" class="score-btn score-btn--plus-a">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">Team Logo</label>
                        <div class="logo-dropzone" id="teamA-dropzone"
                            onclick="document.getElementById('teamA-logo-input').click()">
                            <input type="file" id="teamA-logo-input" accept="image/*" style="display: none;"
                                onchange="handleLogoSelect('A', this)">
                            <div id="teamA-logo-preview" class="logo-dropzone__preview">
                                <i class="ph-duotone ph-image logo-dropzone__icon"></i>
                                <span class="logo-dropzone__text">Click to upload logo</span>
                                <span class="logo-dropzone__hint">PNG, JPG, SVG (max 2MB)</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="saveTeam('A')" class="btn btn-update btn-update--a">
                        Update Team A
                    </button>
                </div>

                <!-- Roster -->
                <div class="roster-section">
                    <div class="roster-header">
                        <span class="roster-title">Active Roster</span>
                    </div>
                    <div id="teamA-players" class="roster-list"></div>
                </div>
            </section>

            <!-- Swap Button -->
            <div class="center-column">
                <button onclick="swapSides()" class="swap-btn" id="swap-btn">
                    <i class="ph-bold ph-arrows-left-right"></i>
                    <span>Swap</span>
                </button>
                <span id="swap-status" class="swap-status">Normal</span>
            </div>

            <!-- Team B Panel -->
            <section class="team-panel team-panel--b" id="teamB-section">
                <div class="team-panel__header" id="teamB-header">
                    <div class="team-panel__indicator" id="teamB-accent"></div>
                    <h2 class="team-panel__title">Team B</h2>
                    <span class="team-panel__subtitle">(Away)</span>
                </div>

                <!-- Template Selector -->
                <div class="template-selector">
                    <select id="teamB-template" class="input">
                        <option value="">Select Template...</option>
                    </select>
                    <button onclick="loadTemplate('B')" class="btn btn-secondary">
                        <i class="ph-bold ph-download-simple"></i>
                        Load
                    </button>
                </div>

                <!-- Team Card -->
                <div class="team-card team-card--b" id="teamB-card">
                    <div class="form-group">
                        <label class="label">Team Name</label>
                        <input type="text" id="teamB-name" class="input" placeholder="Enter team name">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="label">Color</label>
                            <div class="color-picker-row">
                                <input type="color" id="teamB-color" class="color-swatch" value="#FF3B30">
                                <button onclick="pickScreenColor('B')" class="btn btn-secondary btn-icon"
                                    title="Pick from screen">
                                    <i class="ph-bold ph-eyedropper"></i>
                                </button>
                                <button onclick="pickLogoColor('B')" class="btn btn-secondary btn-icon"
                                    title="Pick from logo">
                                    <i class="ph-bold ph-image"></i>
                                </button>
                                <span id="teamB-color-hex" class="color-hex">#FF3B30</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label">Score</label>
                            <div class="score-control">
                                <button onclick="adjustScore('B', -1)" class="score-btn score-btn--minus">−</button>
                                <input type="number" id="teamB-score" class="score-display" value="0" readonly>
                                <button onclick="adjustScore('B', 1)" class="score-btn score-btn--plus-b">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">Team Logo</label>
                        <div class="logo-dropzone" id="teamB-dropzone"
                            onclick="document.getElementById('teamB-logo-input').click()">
                            <input type="file" id="teamB-logo-input" accept="image/*" style="display: none;"
                                onchange="handleLogoSelect('B', this)">
                            <div id="teamB-logo-preview" class="logo-dropzone__preview">
                                <i class="ph-duotone ph-image logo-dropzone__icon"></i>
                                <span class="logo-dropzone__text">Click to upload logo</span>
                                <span class="logo-dropzone__hint">PNG, JPG, SVG (max 2MB)</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="saveTeam('B')" class="btn btn-update btn-update--b">
                        Update Team B
                    </button>
                </div>

                <!-- Roster -->
                <div class="roster-section">
                    <div class="roster-header">
                        <span class="roster-title">Active Roster</span>
                    </div>
                    <div id="teamB-players" class="roster-list"></div>

    <!-- Load main.ts -->
    <script src="/main.js"></script>
    <script>
        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            const theme = document.documentElement.getAttribute('data-theme');
            icon.className = theme === 'dark' ? 'ph-bold ph-moon' : 'ph-bold ph-sun';
        }

        // Load saved theme
        (function () {
            const savedTheme = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon();
        })();

        // Navigation Menu Toggle
        function toggleSettingsMenu() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('settings-menu');
            const btn = document.getElementById('hamburger-btn');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        // Page Switching
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-menu__item').forEach(n => n.classList.remove('active'));

            document.getElementById(`page-${pageName}`).classList.add('active');
            document.getElementById(`nav-${pageName}`).classList.add('active');

            document.getElementById('settings-menu').classList.remove('active');
        }

        // Set Overlay URLs
        const baseUrl = window.location.origin;
        document.getElementById('overlay-rov-url').value = `${baseUrl}/overlay-rov.html`;
        document.getElementById('hero-team-a-url').value = `${baseUrl}/hero-team-a.html`;
        document.getElementById('hero-team-b-url').value = `${baseUrl}/hero-team-b.html`;
        document.getElementById('smart-transition-url').value = `${baseUrl}/smart-transition.html`;

        function copyUrlById(inputId) {
            const input = document.getElementById(inputId);
            navigator.clipboard.writeText(input.value);
            showNotification('Copied!', 'URL copied to clipboard', 'success');
        }

        // ===========================================
        // DYNAMIC ISLAND NOTIFICATION SYSTEM
        // ===========================================

        let notificationTimeout = null;

        function showNotification(title, subtitle = '', type = 'info', duration = 3000) {
            // Get or create island element
            let island = document.getElementById('dynamic-island');
            if (!island) {
                island = document.createElement('div');
                island.id = 'dynamic-island';
                island.className = 'dynamic-island';
                island.innerHTML = `
                    <div class="dynamic-island__content">
                        <div class="dynamic-island__icon"></div>
                        <div class="dynamic-island__text">
                            <div class="dynamic-island__title"></div>
                            <div class="dynamic-island__subtitle"></div>
                        </div>
                    </div>
                `;
                document.body.appendChild(island);
            }

            // Clear any existing timeout
            if (notificationTimeout) {
                clearTimeout(notificationTimeout);
            }

            // Update content
            const iconEl = island.querySelector('.dynamic-island__icon');
            const titleEl = island.querySelector('.dynamic-island__title');
            const subtitleEl = island.querySelector('.dynamic-island__subtitle');

            // Set icon based on type
            const icons = {
                success: '<i class="ph-bold ph-check"></i>',
                error: '<i class="ph-bold ph-x"></i>',
                warning: '<i class="ph-bold ph-warning"></i>',
                info: '<i class="ph-bold ph-info"></i>'
            };

            iconEl.innerHTML = icons[type] || icons.info;
            iconEl.className = `dynamic-island__icon dynamic-island__icon--${type}`;
            titleEl.textContent = title;
            subtitleEl.textContent = subtitle;
            subtitleEl.style.display = subtitle ? 'block' : 'none';

            // Show with animation
            island.classList.remove('animate-out', 'show', 'compact');
            island.classList.add(subtitle ? 'expanded' : 'compact');

            // Force reflow
            void island.offsetWidth;

            island.classList.add('animate-in', 'show');

            // Auto hide
            notificationTimeout = setTimeout(() => {
                hideNotification();
            }, duration);
        }

        function hideNotification() {
            const island = document.getElementById('dynamic-island');
            if (island) {
                island.classList.remove('animate-in');
                island.classList.add('animate-out');
                setTimeout(() => {
                    island.classList.remove('show', 'animate-out');
                }, 300);
            }
        }

        // Expose globally for main.ts to use
        window.showNotification = showNotification;
        window.hideNotification = hideNotification;

        // ===========================================
        // LOGO UPLOAD HANDLER
        // ===========================================

        function handleLogoSelect(side, input) {
            const file = input.files[0];
            if (!file) return;

            // Validate file size (2MB max)
            if (file.size > 2 * 1024 * 1024) {
                showNotification('File too large', 'Maximum size is 2MB', 'error');
                input.value = '';
                return;
            }

            // Validate file type
            if (!file.type.startsWith('image/')) {
                showNotification('Invalid file', 'Please select an image file', 'error');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const previewId = `team${side}-logo-preview`;
                const dropzoneId = `team${side}-dropzone`;
                const preview = document.getElementById(previewId);
                const dropzone = document.getElementById(dropzoneId);

                if (preview && dropzone) {
                    // Add has-logo class to dropzone
                    dropzone.classList.add('has-logo');

                    // Replace preview content with image
                    preview.innerHTML = `<img src="${e.target.result}" class="logo-dropzone__image" alt="Team ${side} Logo">`;

                    // Show success notification
                    showNotification('Logo uploaded', `Team ${side} logo updated`, 'success');
                }
            };
            reader.readAsDataURL(file);
        }

        // Expose globally
        window.handleLogoSelect = handleLogoSelect;
    </script>
