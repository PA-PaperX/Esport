<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Lower Third - Esport Control</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Custom Fonts (injected dynamically) -->
  <style id="custom-fonts"></style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Outfit", "Rajdhani", sans-serif;
      background: transparent;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    /* ========================================
           LOWER THIRD - ULTRA MODERN ESPORT DESIGN
           Enhanced with Glassmorphism & Micro-interactions
           ======================================== */

    .lower-third {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      min-width: 800px;
      max-width: 1400px;
      height: auto;
      background: linear-gradient(135deg,
          rgba(15, 15, 30, 0.92) 0%,
          rgba(25, 20, 50, 0.88) 50%,
          rgba(15, 15, 30, 0.92) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 48px;
      gap: 18px;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.55),
        0 0 120px rgba(99, 102, 241, 0.12),
        0 0 60px rgba(168, 85, 247, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
    }

    /* Animated Gradient Border */
    .lower-third::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg,
          transparent 0%,
          #6366f1 15%,
          #a855f7 35%,
          #ec4899 50%,
          #a855f7 65%,
          #6366f1 85%,
          transparent 100%);
      background-size: 200% 100%;
      border-radius: 20px 20px 0 0;
      animation: shimmerBorder 3s linear infinite;
    }

    /* Bottom subtle glow line */
    .lower-third::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg,
          transparent,
          rgba(99, 102, 241, 0.4),
          transparent);
      border-radius: 0 0 20px 20px;
    }

    @keyframes shimmerBorder {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .lower-third.visible {
      transform: translateX(-50%) translateY(0);
    }

    /* Main Title Section */
    .title-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      animation: fadeSlideIn 0.6s ease-out 0.2s both;
    }

    .title-decoration {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1);
      position: relative;
      opacity: 0.8;
    }

    .title-decoration::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      width: 8px;
      height: 8px;
      background: #6366f1;
      border-radius: 50%;
      box-shadow: 0 0 10px #6366f1;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .title-decoration.right {
      background: linear-gradient(90deg, #6366f1, transparent);
    }

    .title-decoration.right::after {
      right: auto;
      left: 0;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .main-title {
      font-family: var(--custom-font-title, "Rajdhani"), sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow:
        0 0 20px rgba(99, 102, 241, 0.5),
        0 0 40px rgba(99, 102, 241, 0.3);
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Slots Container */
    .slots-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: linear-gradient(135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.03) 100%);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      backdrop-filter: blur(10px);
      cursor: default;
    }

    /* Staggered animation for slots */
    .lower-third.visible .slot:nth-child(1) {
      animation: slotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    .lower-third.visible .slot:nth-child(2) {
      animation: slotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
    }

    .lower-third.visible .slot:nth-child(3) {
      animation: slotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
    }

    .lower-third.visible .slot:nth-child(4) {
      animation: slotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
    }

    .lower-third.visible .slot:nth-child(5) {
      animation: slotAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards;
    }

    @keyframes slotAppear {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slot:hover {
      background: linear-gradient(135deg,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(168, 85, 247, 0.1) 100%);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-4px) scale(1.02);
      box-shadow:
        0 10px 30px rgba(99, 102, 241, 0.2),
        0 0 20px rgba(99, 102, 241, 0.1);
    }

    .slot.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      display: none;
    }

    .slot-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.3s ease;
    }

    .slot:hover .slot-icon {
      transform: scale(1.15);
      animation: iconBounce 0.5s ease;
    }

    @keyframes iconBounce {

      0%,
      100% {
        transform: scale(1.15);
      }

      50% {
        transform: scale(1.25);
      }
    }

    /* Social Media Icons with glow */
    .slot-icon.facebook {
      color: #1877f2;
      filter: drop-shadow(0 0 4px rgba(24, 119, 242, 0.5));
    }

    .slot-icon.youtube {
      color: #ff0000;
      filter: drop-shadow(0 0 4px rgba(255, 0, 0, 0.5));
    }

    .slot-icon.tiktok {
      color: #ffffff;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
    }

    .slot-icon.twitch {
      color: #9146ff;
      filter: drop-shadow(0 0 4px rgba(145, 70, 255, 0.5));
    }

    .slot-icon.discord {
      color: #5865f2;
      filter: drop-shadow(0 0 4px rgba(88, 101, 242, 0.5));
    }

    .slot-icon.twitter {
      color: #1da1f2;
      filter: drop-shadow(0 0 4px rgba(29, 161, 242, 0.5));
    }

    .slot-logo {
      width: 26px;
      height: 26px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 6px;
      transition: transform 0.3s ease;
    }

    .slot:hover .slot-logo {
      transform: scale(1.1);
    }

    .slot-text {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      letter-spacing: 0.5px;
      font-family: var(--custom-font-slots, "Outfit"), sans-serif;
      transition: color 0.3s ease;
    }

    .slot:hover .slot-text {
      color: #ffffff;
    }

    /* Enhanced Glow Animation */
    @keyframes glowPulse {

      0%,
      100% {
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.55),
          0 0 80px rgba(99, 102, 241, 0.1),
          0 0 40px rgba(168, 85, 247, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      50% {
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.55),
          0 0 100px rgba(99, 102, 241, 0.18),
          0 0 60px rgba(168, 85, 247, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
    }

    .lower-third.visible {
      animation: glowPulse 4s ease-in-out infinite;
    }

    /* Status indicator (hidden in production) */
    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border-radius: 20px;
      font-size: 12px;
      z-index: 1000;
      display: none;
    }

    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }
  </style>
</head>

<body>
  <div class="lower-third" id="lower-third">
    <div class="title-section">
      <div class="title-decoration"></div>
      <span class="main-title" id="main-title">ROV PRO LEAGUE 2025 WINTER</span>
      <div class="title-decoration right"></div>
    </div>

    <div class="slots-container" id="slots-container">
      <div class="slot" id="slot-1">
        <div class="slot-icon facebook" id="slot-1-icon">📘</div>
        <div class="slot-logo" id="slot-1-logo" style="display: none"></div>
        <span class="slot-text" id="slot-1-text">Facebook</span>
      </div>
      <div class="slot" id="slot-2">
        <div class="slot-icon youtube" id="slot-2-icon">▶️</div>
        <div class="slot-logo" id="slot-2-logo" style="display: none"></div>
        <span class="slot-text" id="slot-2-text">YouTube</span>
      </div>
      <div class="slot" id="slot-3">
        <div class="slot-icon tiktok" id="slot-3-icon">🎵</div>
        <div class="slot-logo" id="slot-3-logo" style="display: none"></div>
        <span class="slot-text" id="slot-3-text">TikTok</span>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const lowerThird = document.getElementById("lower-third");
    const mainTitle = document.getElementById("main-title");

    // State
    let ws = null;
    let currentState = null;

    // Default social media icons (emoji fallback)
    const defaultIcons = {
      facebook: "📘",
      youtube: "▶️",
      tiktok: "🎵",
      twitch: "🎮",
      discord: "💬",
      twitter: "🐦",
    };

    // Font state
    let fontSettings = null;

    // WebSocket connection
    function connectWebSocket() {
      ws = new WebSocket(`ws://${window.location.host}/ws`);

      ws.onopen = () => {
        console.log("✅ Connected to server");
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === "LOWER_THIRD_UPDATE" && msg.data) {
            currentState = msg.data;
            renderLowerThird();
          }

          // Handle font updates
          if (msg.type === "FONT_UPDATE" && msg.data) {
            fontSettings = msg.data;
            applyCustomFonts();
          }
        } catch (e) {
          console.error("Message parse error:", e);
        }
      };

      ws.onclose = () => {
        console.log("❌ Disconnected");
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => ws?.close();
    }

    // Render Lower Third
    function renderLowerThird() {
      if (!currentState) return;

      // Show/hide bar
      if (currentState.enabled) {
        lowerThird.classList.add("visible");
      } else {
        lowerThird.classList.remove("visible");
      }

      // Update title
      mainTitle.textContent = currentState.title || "";

      // Update slots
      currentState.slots?.forEach((slot) => {
        const slotEl = document.getElementById(`slot-${slot.id}`);
        const iconEl = document.getElementById(`slot-${slot.id}-icon`);
        const logoEl = document.getElementById(`slot-${slot.id}-logo`);
        const textEl = document.getElementById(`slot-${slot.id}-text`);

        if (!slotEl) return;

        // Show/hide slot based on enabled state
        if (slot.enabled) {
          slotEl.classList.remove("hidden");
          slotEl.style.display = "";
        } else {
          slotEl.classList.add("hidden");
          slotEl.style.display = "none";
        }

        // Update text
        textEl.textContent = slot.text || slot.label || "";

        // Logo or Icon mode
        if (slot.type === "logo" && slot.logoPath) {
          // Show custom logo
          logoEl.style.backgroundImage = `url('${slot.logoPath}?t=${Date.now()}')`;
          logoEl.style.display = "block";
          iconEl.style.display = "none";
        } else {
          // Show default icon
          logoEl.style.display = "none";
          iconEl.style.display = "flex";

          // Set icon based on label/text
          const label = (slot.label || slot.text || "").toLowerCase();
          if (label.includes("facebook")) {
            iconEl.textContent = defaultIcons.facebook;
            iconEl.className = "slot-icon facebook";
          } else if (label.includes("youtube")) {
            iconEl.textContent = defaultIcons.youtube;
            iconEl.className = "slot-icon youtube";
          } else if (label.includes("tiktok")) {
            iconEl.textContent = defaultIcons.tiktok;
            iconEl.className = "slot-icon tiktok";
          } else if (label.includes("twitch")) {
            iconEl.textContent = defaultIcons.twitch;
            iconEl.className = "slot-icon twitch";
          } else if (label.includes("discord")) {
            iconEl.textContent = defaultIcons.discord;
            iconEl.className = "slot-icon discord";
          } else if (label.includes("twitter") || label.includes("x")) {
            iconEl.textContent = defaultIcons.twitter;
            iconEl.className = "slot-icon twitter";
          }
        }
      });
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", async () => {
      // Load initial state
      try {
        const response = await fetch("/api/lower-third");
        if (response.ok) {
          currentState = await response.json();
          renderLowerThird();
        }
      } catch (e) {
        console.log("Failed to load initial state");
      }

      // Connect WebSocket for updates
      connectWebSocket();

      // Load font settings
      loadFontSettings();
    });

    // Load font settings
    async function loadFontSettings() {
      try {
        const response = await fetch("/api/fonts");
        if (response.ok) {
          fontSettings = await response.json();
          applyCustomFonts();
        }
      } catch (e) {
        console.log("Failed to load font settings");
      }
    }

    // Apply custom fonts
    function applyCustomFonts() {
      if (!fontSettings) return;

      // Inject @font-face rules
      const styleEl = document.getElementById("custom-fonts");
      let css = "";
      for (const font of fontSettings.fonts || []) {
        css += `
          @font-face {
            font-family: '${font.name}';
            src: url('${font.path}') format('${font.format}');
            font-weight: ${font.weight || "normal"};
            font-style: ${font.style || "normal"};
            font-display: swap;
          }
        `;
      }
      styleEl.textContent = css;

      // Apply font assignments
      const assignments = fontSettings.assignments || {};

      // Get font name by ID
      const getFontName = (fontId) => {
        if (!fontId) return null;
        const font = (fontSettings.fonts || []).find((f) => f.id === fontId);
        return font ? font.name : null;
      };

      // Apply to title
      const titleFont = getFontName(assignments.lowerThirdTitle);
      document.documentElement.style.setProperty(
        "--custom-font-title",
        titleFont ? `'${titleFont}'` : '"Rajdhani"',
      );

      // Apply to slots
      const slotsFont = getFontName(assignments.lowerThirdSlots);
      document.documentElement.style.setProperty(
        "--custom-font-slots",
        slotsFont ? `'${slotsFont}'` : '"Outfit"',
      );

      console.log("🔤 Custom fonts applied");
    }
  </script>
</body>

</html>
