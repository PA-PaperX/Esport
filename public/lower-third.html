<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lower Third - Esport Control</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom Fonts (injected dynamically) -->
    <style id="custom-fonts"></style>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", "Rajdhani", sans-serif;
        background: transparent;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
      }

      /* ========================================
           LOWER THIRD - MODERN ESPORT DESIGN
           ======================================== */

      .lower-third {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(150%);
        min-width: 800px;
        max-width: 1400px;
        height: auto;
        background: linear-gradient(
          135deg,
          rgba(15, 15, 25, 0.95) 0%,
          rgba(25, 25, 45, 0.9) 50%,
          rgba(15, 15, 25, 0.95) 100%
        );
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 40px;
        gap: 16px;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        box-shadow:
          0 25px 50px rgba(0, 0, 0, 0.5),
          0 0 100px rgba(79, 70, 229, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .lower-third::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #6366f1 20%,
          #a855f7 50%,
          #6366f1 80%,
          transparent 100%
        );
        border-radius: 16px 16px 0 0;
      }

      .lower-third.visible {
        transform: translateX(-50%) translateY(0);
      }

      /* Main Title Section */
      .title-section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        width: 100%;
      }

      .title-decoration {
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #6366f1);
      }

      .title-decoration.right {
        background: linear-gradient(90deg, #6366f1, transparent);
      }

      .main-title {
        font-family: var(--custom-font-title, "Rajdhani"), sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        white-space: nowrap;
      }

      /* Slots Container */
      .slots-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .slot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        opacity: 1;
        transform: translateY(0);
      }

      .slot:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(99, 102, 241, 0.5);
        transform: translateY(-2px);
      }

      .slot.hidden {
        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
        display: none;
      }

      .slot-icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      /* Social Media Icons using Unicode/Emoji alternatives */
      .slot-icon.facebook {
        color: #1877f2;
      }

      .slot-icon.youtube {
        color: #ff0000;
      }

      .slot-icon.tiktok {
        color: #ffffff;
      }

      .slot-icon.twitch {
        color: #9146ff;
      }

      .slot-icon.discord {
        color: #5865f2;
      }

      .slot-icon.twitter {
        color: #1da1f2;
      }

      .slot-logo {
        width: 24px;
        height: 24px;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 4px;
      }

      .slot-text {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
        letter-spacing: 0.5px;
        font-family: var(--custom-font-slots, "Outfit"), sans-serif;
      }

      /* Animation keyframes */
      @keyframes slideIn {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(150%);
        }

        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes slideOut {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }

        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(150%);
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow:
            0 25px 50px rgba(0, 0, 0, 0.5),
            0 0 60px rgba(99, 102, 241, 0.1);
        }

        50% {
          box-shadow:
            0 25px 50px rgba(0, 0, 0, 0.5),
            0 0 80px rgba(99, 102, 241, 0.2);
        }
      }

      .lower-third.visible {
        animation: glow 4s ease-in-out infinite;
      }

      /* Status indicator (hidden in production) */
      .status {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border-radius: 20px;
        font-size: 12px;
        z-index: 1000;
        display: none;
        /* Hidden by default */
      }

      .status .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        margin-right: 8px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>

  <body>
    <div class="lower-third" id="lower-third">
      <div class="title-section">
        <div class="title-decoration"></div>
        <span class="main-title" id="main-title"
          >ROV PRO LEAGUE 2025 WINTER</span
        >
        <div class="title-decoration right"></div>
      </div>

      <div class="slots-container" id="slots-container">
        <div class="slot" id="slot-1">
          <div class="slot-icon facebook" id="slot-1-icon">📘</div>
          <div class="slot-logo" id="slot-1-logo" style="display: none"></div>
          <span class="slot-text" id="slot-1-text">Facebook</span>
        </div>
        <div class="slot" id="slot-2">
          <div class="slot-icon youtube" id="slot-2-icon">▶️</div>
          <div class="slot-logo" id="slot-2-logo" style="display: none"></div>
          <span class="slot-text" id="slot-2-text">YouTube</span>
        </div>
        <div class="slot" id="slot-3">
          <div class="slot-icon tiktok" id="slot-3-icon">🎵</div>
          <div class="slot-logo" id="slot-3-logo" style="display: none"></div>
          <span class="slot-text" id="slot-3-text">TikTok</span>
        </div>
      </div>
    </div>

    <script>
      // Elements
      const lowerThird = document.getElementById("lower-third");
      const mainTitle = document.getElementById("main-title");

      // State
      let ws = null;
      let currentState = null;

      // Default social media icons (emoji fallback)
      const defaultIcons = {
        facebook: "📘",
        youtube: "▶️",
        tiktok: "🎵",
        twitch: "🎮",
        discord: "💬",
        twitter: "🐦",
      };

      // Font state
      let fontSettings = null;

      // WebSocket connection
      function connectWebSocket() {
        ws = new WebSocket(`ws://localhost:3000/ws`);

        ws.onopen = () => {
          console.log("✅ Connected to server");
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.type === "LOWER_THIRD_UPDATE" && msg.data) {
              currentState = msg.data;
              renderLowerThird();
            }

            // Handle font updates
            if (msg.type === "FONT_UPDATE" && msg.data) {
              fontSettings = msg.data;
              applyCustomFonts();
            }
          } catch (e) {
            console.error("Message parse error:", e);
          }
        };

        ws.onclose = () => {
          console.log("❌ Disconnected");
          setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = () => ws?.close();
      }

      // Render Lower Third
      function renderLowerThird() {
        if (!currentState) return;

        // Show/hide bar
        if (currentState.enabled) {
          lowerThird.classList.add("visible");
        } else {
          lowerThird.classList.remove("visible");
        }

        // Update title
        mainTitle.textContent = currentState.title || "";

        // Update slots
        currentState.slots?.forEach((slot) => {
          const slotEl = document.getElementById(`slot-${slot.id}`);
          const iconEl = document.getElementById(`slot-${slot.id}-icon`);
          const logoEl = document.getElementById(`slot-${slot.id}-logo`);
          const textEl = document.getElementById(`slot-${slot.id}-text`);

          if (!slotEl) return;

          // Show/hide slot based on enabled state
          if (slot.enabled) {
            slotEl.classList.remove("hidden");
            slotEl.style.display = "";
          } else {
            slotEl.classList.add("hidden");
            slotEl.style.display = "none";
          }

          // Update text
          textEl.textContent = slot.text || slot.label || "";

          // Logo or Icon mode
          if (slot.type === "logo" && slot.logoPath) {
            // Show custom logo
            logoEl.style.backgroundImage = `url('${slot.logoPath}?t=${Date.now()}')`;
            logoEl.style.display = "block";
            iconEl.style.display = "none";
          } else {
            // Show default icon
            logoEl.style.display = "none";
            iconEl.style.display = "flex";

            // Set icon based on label/text
            const label = (slot.label || slot.text || "").toLowerCase();
            if (label.includes("facebook")) {
              iconEl.textContent = defaultIcons.facebook;
              iconEl.className = "slot-icon facebook";
            } else if (label.includes("youtube")) {
              iconEl.textContent = defaultIcons.youtube;
              iconEl.className = "slot-icon youtube";
            } else if (label.includes("tiktok")) {
              iconEl.textContent = defaultIcons.tiktok;
              iconEl.className = "slot-icon tiktok";
            } else if (label.includes("twitch")) {
              iconEl.textContent = defaultIcons.twitch;
              iconEl.className = "slot-icon twitch";
            } else if (label.includes("discord")) {
              iconEl.textContent = defaultIcons.discord;
              iconEl.className = "slot-icon discord";
            } else if (label.includes("twitter") || label.includes("x")) {
              iconEl.textContent = defaultIcons.twitter;
              iconEl.className = "slot-icon twitter";
            }
          }
        });
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", async () => {
        // Load initial state
        try {
          const response = await fetch("/api/lower-third");
          if (response.ok) {
            currentState = await response.json();
            renderLowerThird();
          }
        } catch (e) {
          console.log("Failed to load initial state");
        }

        // Connect WebSocket for updates
        connectWebSocket();

        // Load font settings
        loadFontSettings();
      });

      // Load font settings
      async function loadFontSettings() {
        try {
          const response = await fetch("/api/fonts");
          if (response.ok) {
            fontSettings = await response.json();
            applyCustomFonts();
          }
        } catch (e) {
          console.log("Failed to load font settings");
        }
      }

      // Apply custom fonts
      function applyCustomFonts() {
        if (!fontSettings) return;

        // Inject @font-face rules
        const styleEl = document.getElementById("custom-fonts");
        let css = "";
        for (const font of fontSettings.fonts || []) {
          css += `
          @font-face {
            font-family: '${font.name}';
            src: url('${font.path}') format('${font.format}');
            font-weight: ${font.weight || "normal"};
            font-style: ${font.style || "normal"};
            font-display: swap;
          }
        `;
        }
        styleEl.textContent = css;

        // Apply font assignments
        const assignments = fontSettings.assignments || {};

        // Get font name by ID
        const getFontName = (fontId) => {
          if (!fontId) return null;
          const font = (fontSettings.fonts || []).find((f) => f.id === fontId);
          return font ? font.name : null;
        };

        // Apply to title
        const titleFont = getFontName(assignments.lowerThirdTitle);
        document.documentElement.style.setProperty(
          "--custom-font-title",
          titleFont ? `'${titleFont}'` : '"Rajdhani"',
        );

        // Apply to slots
        const slotsFont = getFontName(assignments.lowerThirdSlots);
        document.documentElement.style.setProperty(
          "--custom-font-slots",
          slotsFont ? `'${slotsFont}'` : '"Outfit"',
        );

        console.log("🔤 Custom fonts applied");
      }
    </script>
  </body>
</html>
