<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transition Demo</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            /* For OBS */
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Demo Background Checkered (to show transparency) */
        .demo-bg {
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #333;
            position: absolute;
            inset: 0;
            z-index: -1;
        }

        .stinger-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Elements */
        .panel {
            position: absolute;
            height: 120vh;
            /* Tilted coverage */
            width: 50vw;
            top: -10vh;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .panel-left {
            left: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(30, 64, 175, 0.98));
            transform: translateX(-100%) skewX(-15deg);
            transform-origin: bottom left;
            border-right: 4px solid #60a5fa;
            box-shadow: 10px 0 50px rgba(59, 130, 246, 0.5);
        }

        .panel-right {
            right: 0;
            background: linear-gradient(225deg, rgba(239, 68, 68, 0.95), rgba(153, 27, 27, 0.98));
            transform: translateX(100%) skewX(-15deg);
            transform-origin: top right;
            border-left: 4px solid #f87171;
            box-shadow: -10px 0 50px rgba(239, 68, 68, 0.5);
        }

        .organizer-logo {
            position: absolute;
            z-index: 20;
            font-size: 8rem;
            color: white;
            opacity: 0;
            transform: scale(0);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        .score-box {
            position: absolute;
            z-index: 50;
            /* Higher than panels */
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 50px;
            border-radius: 12px;
            color: white;
            font-size: 4rem;
            font-weight: 900;
            font-style: italic;
            opacity: 0;
            transform: scale(0.8) translateY(100px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 40px;
            align-items: center;
            top: 60%;
        }

        .score-divider {
            width: 4px;
            height: 60px;
            background: white;
            transform: skewX(-20deg);
        }

        .team-logo-container {
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: white;
            opacity: 0;
            /* Hidden initially */
            transform: translateY(-50px);
        }

        /* Fix: Push content away from the center split to avoid being covered */
        .panel-left .team-logo-container {
            margin-right: 15vw;
            /* Push Left logo to the left */
        }

        .panel-right .team-logo-container {
            margin-left: 15vw;
            /* Push Right logo to the right */
        }

        .team-logo-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        /* Animation Sequence Classes */
        .animate-in .panel-left {
            transform: translateX(0%) skewX(-15deg);
        }

        .animate-in .panel-right {
            transform: translateX(0%) skewX(-15deg);
        }

        .animate-out .panel-left {
            transform: translateX(-100%) skewX(-15deg);
        }

        .animate-out .panel-right {
            transform: translateX(100%) skewX(-15deg);
        }

        .show-organizer {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .show-content {
            opacity: 1;
            transition: opacity 0.3s 0.2s, transform 0.5s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(-50px);
        }

        .show-score {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }

            80% {
                transform: scale(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }
    </style>
</head>

<body>
    <!-- Checkered background only for demo -->
    <div class="demo-bg" id="demo-bg"></div>

    <div class="stinger-container" id="stinger">
        <!-- Panels -->
        <div class="panel panel-left" id="panel-left">
            <div class="team-logo-container" id="teamA-content">
                <div id="teamA-name" class="text-4xl font-bold uppercase tracking-widest mb-2"
                    style="text-shadow: 0 0 10px rgba(0,0,0,0.5);">Team A</div>
                <div id="teamA-logo-container">
                    <!-- Default Logo -->
                    <i
                        class="ph-duotone ph-shield-check team-logo-img text-white text-8xl flex items-center justify-center"></i>
                </div>
            </div>
        </div>
        <div class="panel panel-right" id="panel-right">
            <div class="team-logo-container" id="teamB-content">
                <div id="teamB-name" class="text-4xl font-bold uppercase tracking-widest mb-2"
                    style="text-shadow: 0 0 10px rgba(0,0,0,0.5);">Team B</div>
                <div id="teamB-logo-container">
                    <!-- Default Logo -->
                    <i
                        class="ph-duotone ph-sword team-logo-img text-white text-8xl flex items-center justify-center"></i>
                </div>
            </div>
        </div>

        <!-- Center Items -->
        <div class="organizer-logo" id="org-logo">
            <i class="ph-fill ph-trophy text-yellow-400"></i>
        </div>

        <div class="score-box" id="score-box">
            <span class="text-blue-400" id="score-a">2</span>
            <div class="score-divider"></div>
            <span class="text-red-400" id="score-b">1</span>
        </div>
    </div>

    <!-- Controls for Demo -->
    <div
        style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px;">
        <button onclick="playTransition()"
            class="bg-white text-black px-6 py-2 rounded-full font-bold shadow-lg hover:bg-gray-200 transition">
            ▶ Play Stinger
        </button>
        <button onclick="toggleBg()"
            class="bg-gray-800 text-white px-6 py-2 rounded-full font-bold shadow-lg border border-gray-600">
            Toggle Transparent BG
        </button>
    </div>

    <script>
        // State
        let currentState = null;
        let isPlaying = false;

        async function fetchState() {
            try {
                const response = await fetch('/api/state');
                const state = await response.json();
                if (JSON.stringify(state) !== JSON.stringify(currentState)) {
                    currentState = state;
                    // No automatic updateUI here? 
                    // Verify if we want instant updates or only on Play.
                    // User said "Realtime", so yes.
                    // But for Transition, it usually only matters when it plays.
                    // However, updateUI is fine.
                    // But we need to handle SWAP.
                }
            } catch (err) {
                console.error('Failed to fetch state:', err);
            }
        }

        function updateLogo(containerId, logoPath) {
            const container = document.getElementById(containerId);
            if (!logoPath) {
                // Show default icon
                container.innerHTML = `<i class="ph-duotone ph-shield-check team-logo-img text-white text-8xl flex items-center justify-center"></i>`;
            } else {
                // Show Image
                container.innerHTML = `<img src="${logoPath}" class="team-logo-img" onerror="this.src=''; this.style.display='none'">`;
            }
        }

        function playTransition() {
            if (isPlaying) return;
            isPlaying = true;

            const stinger = document.getElementById('stinger');
            const orgLogo = document.getElementById('org-logo');
            const scoreBox = document.getElementById('score-box');
            const teamAContent = document.getElementById('teamA-content'); // Container
            const teamBContent = document.getElementById('teamB-content'); // Container

            // Fetch latest state AND apply logic
            fetch('/api/state').then(r => r.json()).then(state => {
                currentState = state;

                // Determine Data based on Swap
                const isSwapped = state.swapped;
                const dataLeft = isSwapped ? state.teams.B : state.teams.A;
                const dataRight = isSwapped ? state.teams.A : state.teams.B;
                const scoreLeft = isSwapped ? state.teams.B.score : state.teams.A.score;
                const scoreRight = isSwapped ? state.teams.A.score : state.teams.B.score;

                // Update UI Elements
                // Left Panel (Team A position usually)
                document.getElementById('teamA-name').textContent = dataLeft.name;
                updateLogo('teamA-logo-container', dataLeft.logo);

                // Right Panel (Team B position usually)
                document.getElementById('teamB-name').textContent = dataRight.name;
                updateLogo('teamB-logo-container', dataRight.logo);

                // Score
                document.getElementById('score-a').textContent = scoreLeft;
                document.getElementById('score-b').textContent = scoreRight;

                // Colors (Optional: Swap panel colors??)
                // If Team A is Blue and Team B is Red.
                // If Swapped: Left Panel (Blue) shows Team B (Red Data) -> Mismatch?
                // Usually "Swap" means the TEAMS swap sides on the UI.
                // So Left Panel becomes Team B.
                // Does Left Panel turn RED?
                // The Panel CSS is hardcoded Blue/Red.
                // .panel-left is Blue. .panel-right is Red.
                // If Swapped, we show Team B (Red team) on Left (Blue Panel).
                // This is a COLOR CLASH.
                // Ideally, we should swap the PANEL COLORS too.
                // But simplified: Just show Data.
                // User said "Red eats Blue".
                // If I swap, I should probably also update panel colors if I can.
                // But let's stick to Data Swap first as per ROV logic (Sides swap).

                // ... Animation Logic ...

                // Reset classes
                stinger.classList.remove('animate-in', 'animate-out');
                orgLogo.classList.remove('show-organizer');
                scoreBox.classList.remove('show-score');
                teamAContent.classList.remove('show-content');
                teamBContent.classList.remove('show-content');

                // Force Reflow
                void stinger.offsetWidth;

                // Step 1: Panels Slam In
                stinger.classList.add('animate-in');

                // Step 2: Show Content
                setTimeout(() => { orgLogo.classList.add('show-organizer'); }, 300);

                setTimeout(() => {
                    orgLogo.style.opacity = '0';
                    orgLogo.style.transform = 'scale(2)';

                    teamAContent.classList.add('show-content');
                    teamBContent.classList.add('show-content');
                    scoreBox.classList.add('show-score');
                }, 1200);

                // Step 3: Exit
                setTimeout(() => {
                    stinger.classList.remove('animate-in');
                    stinger.classList.add('animate-out');
                    setTimeout(() => { orgLogo.style = ''; isPlaying = false; }, 500);
                }, 3000);
            }).catch(err => {
                console.error('Transition Error:', err);
                isPlaying = false; // Reset lock
            });
        }

        // ... updateLogo helper ...

        function toggleBg() {
            const bg = document.getElementById('demo-bg');
            bg.style.display = bg.style.display === 'none' ? 'block' : 'none';
        }

        // Poll for updates every 1s (lightweight) so we have fresh data when Play is clicked
        setInterval(fetchState, 1000);
        fetchState(); // Initial load

        // Auto-play for OBS (Wait slightly for state to load)
        window.addEventListener('load', () => {
            setTimeout(() => {
                playTransition();
            }, 500);
        });

        // Expose play function to window so we can trigger it from OBS or other scripts
        window.playTransition = playTransition;
    </script>
</body>

</html>
